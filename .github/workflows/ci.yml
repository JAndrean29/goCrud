name: CI

on:
  ##conditions when the CI will be triggered
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    ##select the image of the environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...